<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, "Noto Sans KR", sans-serif; color: #202124; margin: 0; padding: 24px; }
      h2 { font-size: 18px; margin: 0 0 8px; }
      .help { color: #5f6368; font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
      .drop { border: 2px dashed #9aa0a6; border-radius: 10px; padding: 42px 18px; text-align: center; cursor: pointer; background: #f8f9fa; }
      .drop.over { border-color: #1a73e8; background: #e8f0fe; }
      .filename { margin-top: 10px; font-size: 13px; font-weight: 600; word-break: break-all; }
      input[type=file] { display: none; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
      button { border: 1px solid #dadce0; border-radius: 6px; padding: 9px 16px; background: white; cursor: pointer; }
      button.primary { border-color: #1a73e8; background: #1a73e8; color: white; }
      button:disabled { opacity: .55; cursor: default; }
      .status { min-height: 38px; margin-top: 14px; white-space: pre-line; font-size: 13px; line-height: 1.45; }
      .error { color: #b3261e; }
      .success { color: #137333; }
    </style>
  </head>
  <body>
    <h2>엑셀 신청 파일 업로드</h2>
    <div class="help">확정 양식의 .xlsx 파일만 가능하며 최대 20MB입니다. 원본 파일은 Drive에 영구 저장하지 않습니다.</div>
    <form id="uploadForm">
      <label id="dropZone" class="drop" for="excelFile">
        파일을 이곳에 끌어다 놓거나 클릭하여 선택하세요.
        <div id="fileName" class="filename">선택된 파일 없음</div>
      </label>
      <input id="excelFile" name="excelFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required>
      <div id="status" class="status"></div>
      <div class="actions">
        <button type="button" onclick="google.script.host.close()">취소</button>
        <button id="submitButton" class="primary" type="submit">업로드·등록</button>
      </div>
    </form>
    <script>
      const form = document.getElementById('uploadForm');
      const input = document.getElementById('excelFile');
      const dropZone = document.getElementById('dropZone');
      const fileName = document.getElementById('fileName');
      const status = document.getElementById('status');
      const submitButton = document.getElementById('submitButton');

      function showFile() {
        const file = input.files && input.files[0];
        fileName.textContent = file ? `${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)` : '선택된 파일 없음';
      }
      input.addEventListener('change', showFile);
      ['dragenter', 'dragover'].forEach(type => dropZone.addEventListener(type, event => {
        event.preventDefault();
        dropZone.classList.add('over');
      }));
      ['dragleave', 'drop'].forEach(type => dropZone.addEventListener(type, event => {
        event.preventDefault();
        dropZone.classList.remove('over');
      }));
      dropZone.addEventListener('drop', event => {
        if (!event.dataTransfer.files.length) return;
        const transfer = new DataTransfer();
        transfer.items.add(event.dataTransfer.files[0]);
        input.files = transfer.files;
        showFile();
      });

      form.addEventListener('submit', event => {
        event.preventDefault();
        const file = input.files && input.files[0];
        if (!file) return setError('업로드할 파일을 선택하세요.');
        if (!/\.xlsx$/i.test(file.name)) return setError('.xlsx 파일만 등록할 수 있습니다.');
        if (file.size > 20 * 1024 * 1024) return setError('파일 크기는 20MB 이하여야 합니다.');
        submitButton.disabled = true;
        status.className = 'status';
        status.textContent = '업로드 및 파싱 중입니다. 창을 닫지 마세요…';
        google.script.run
          .withSuccessHandler(message => {
            status.className = 'status success';
            status.textContent = message || '엑셀 등록이 완료되었습니다.';
            submitButton.textContent = '완료';
          })
          .withFailureHandler(error => {
            submitButton.disabled = false;
            setError(error && error.message ? error.message : String(error));
          })
          .직접업로드엑셀파싱(form);
      });
      function setError(message) {
        status.className = 'status error';
        status.textContent = message;
      }
    </script>
  </body>
</html>
