<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, "Noto Sans KR", sans-serif; color: #202124; margin: 0; padding: 20px 24px; }
      .help { color: #5f6368; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
      .drop { display: block; width: 100%; border: 2px dashed #9aa0a6; border-radius: 10px; padding: 34px 18px; text-align: center; cursor: pointer; background: #f8f9fa; line-height: 1.5; }
      .drop.over { border-color: #1a73e8; background: #e8f0fe; }
      .filename { margin-top: 10px; font-size: 13px; font-weight: 600; word-break: break-all; }
      input[type=file] { display: none; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
      button { border: 1px solid #dadce0; border-radius: 6px; padding: 9px 16px; background: white; cursor: pointer; }
      button.primary { border-color: #1a73e8; background: #1a73e8; color: white; }
      button:disabled { opacity: .55; cursor: default; }
      .status { min-height: 40px; margin-top: 12px; white-space: pre-line; overflow-wrap: anywhere; font-size: 13px; line-height: 1.45; }
      .progress { height: 8px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: #e8eaed; }
      .bar { width: 0; height: 100%; background: #1a73e8; transition: width .3s ease; }
      .elapsed { margin-top: 5px; color: #5f6368; font-size: 12px; }
      .error { color: #b3261e; }
      .success { color: #137333; }
    </style>
  </head>
  <body>
    <div class="help">확정 양식의 .xlsx 파일만 가능하며 최대 20MB입니다. 원본 파일은 Drive에 영구 저장하지 않습니다.</div>
    <form id="uploadForm">
      <label id="dropZone" class="drop" for="excelFile">
        파일을 이곳에 끌어다 놓거나 클릭하여 선택하세요.
        <div id="fileName" class="filename">선택된 파일 없음</div>
      </label>
      <input id="excelFile" name="excelFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required>
      <div class="progress" aria-label="업로드 진행률"><div id="progressBar" class="bar"></div></div>
      <div id="elapsed" class="elapsed"></div>
      <div id="status" class="status"></div>
      <div class="actions">
        <button id="cancelButton" type="button" onclick="google.script.host.close()">취소</button>
        <button id="submitButton" class="primary" type="submit">업로드·등록</button>
      </div>
    </form>
    <script>
      const form = document.getElementById('uploadForm');
      const input = document.getElementById('excelFile');
      const dropZone = document.getElementById('dropZone');
      const fileName = document.getElementById('fileName');
      const status = document.getElementById('status');
      const progressBar = document.getElementById('progressBar');
      const elapsed = document.getElementById('elapsed');
      const cancelButton = document.getElementById('cancelButton');
      const submitButton = document.getElementById('submitButton');
      let running = false;
      let startedAt = 0;
      let elapsedTimer = null;
      let pollTimer = null;

      function showFile() {
        const file = input.files && input.files[0];
        fileName.textContent = file ? `${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)` : '선택된 파일 없음';
      }
      input.addEventListener('change', showFile);
      ['dragenter', 'dragover'].forEach(type => dropZone.addEventListener(type, event => {
        event.preventDefault();
        dropZone.classList.add('over');
      }));
      ['dragleave', 'drop'].forEach(type => dropZone.addEventListener(type, event => {
        event.preventDefault();
        dropZone.classList.remove('over');
      }));
      dropZone.addEventListener('drop', event => {
        if (!event.dataTransfer.files.length) return;
        const transfer = new DataTransfer();
        transfer.items.add(event.dataTransfer.files[0]);
        input.files = transfer.files;
        showFile();
      });

      form.addEventListener('submit', event => {
        event.preventDefault();
        const file = input.files && input.files[0];
        if (!file) return setError('업로드할 파일을 선택하세요.');
        if (!/\.xlsx$/i.test(file.name)) return setError('.xlsx 파일만 등록할 수 있습니다.');
        if (file.size > 20 * 1024 * 1024) return setError('파일 크기는 20MB 이하여야 합니다.');
        submitButton.disabled = true;
        running = true;
        startedAt = Date.now();
        updateProgress(2, '로컬 파일을 읽기 시작했습니다.');
        elapsedTimer = setInterval(updateElapsed, 1000);
        status.className = 'status';
        const reader = new FileReader();
        reader.onprogress = event => {
          if (event.lengthComputable) updateProgress(2 + Math.round((event.loaded / event.total) * 10), '로컬 파일을 읽고 있습니다.');
        };
        reader.onerror = () => {
          finishTracking();
          setError('파일을 읽지 못했습니다. 다시 선택해 주세요.');
        };
        reader.onload = () => {
          const dataUrl = String(reader.result || '');
          const comma = dataUrl.indexOf(',');
          if (comma < 0) {
            finishTracking();
            return setError('파일 내용을 변환하지 못했습니다.');
          }
          const jobId = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          updateProgress(12, '파일을 서버로 전송하고 있습니다.');
          pollStatus(jobId);
          google.script.run
            .withSuccessHandler(message => {
              finishTracking();
              updateProgress(100, '등록이 완료되었습니다.');
              status.className = 'status success';
              status.textContent = message || '엑셀 등록이 완료되었습니다.';
              submitButton.textContent = '완료';
              submitButton.type = 'button';
              submitButton.disabled = false;
              submitButton.onclick = () => google.script.host.close();
              cancelButton.hidden = true;
            })
            .withFailureHandler(error => {
              finishTracking();
              setError(error && error.message ? error.message : String(error));
            })
            .직접업로드엑셀파싱({
              jobId,
              name: file.name,
              mimeType: file.type,
              base64: dataUrl.slice(comma + 1),
            });
        };
        reader.readAsDataURL(file);
      });
      function setError(message) {
        status.className = 'status error';
        status.textContent = message;
      }
      function updateProgress(percent, message) {
        progressBar.style.width = `${Math.max(0, Math.min(100, percent))}%`;
        if (message) status.textContent = message;
      }
      function updateElapsed() {
        if (!startedAt) return;
        const seconds = Math.floor((Date.now() - startedAt) / 1000);
        elapsed.textContent = seconds >= 90
          ? `경과시간 ${seconds}초 · 오래 걸리고 있습니다. 창을 닫고 재시도하기 전에 시트 등록 여부를 먼저 확인하세요.`
          : `경과시간 ${seconds}초 · 서버 변환 단계는 파일 크기와 Google 상태에 따라 시간이 걸릴 수 있습니다.`;
      }
      function pollStatus(jobId) {
        if (!running) return;
        google.script.run
          .withSuccessHandler(state => {
            if (!running) return;
            if (state && Number(state.진행률) >= 0) updateProgress(Number(state.진행률), state.메시지);
            pollTimer = setTimeout(() => pollStatus(jobId), 1200);
          })
          .withFailureHandler(() => {
            if (running) pollTimer = setTimeout(() => pollStatus(jobId), 2000);
          })
          .업로드진행상태조회(jobId);
      }
      function finishTracking() {
        running = false;
        submitButton.disabled = false;
        if (elapsedTimer) clearInterval(elapsedTimer);
        if (pollTimer) clearTimeout(pollTimer);
        updateElapsed();
      }
    </script>
  </body>
</html>
